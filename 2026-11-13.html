<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecast dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f4f3f0; --surface: #fcfcfb; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text2: #52514e; --muted: #8b8a84;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s8: #e34948;
  --accent: #2a78d6; --accent-wash: #e6f0fc;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #111110; --surface: #1a1a19; --line: #2e2e2b; --grid: #262624;
    --text: #f0efec; --text2: #c3c2b7; --muted: #8b8a84;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s8: #e66767;
    --accent: #3987e5; --accent-wash: #16263b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }
h1 { font-size: 34px; line-height: 1.15; margin: 0 0 6px; font-weight: 650; letter-spacing: -0.01em; }
h1 span { color: var(--text2); font-weight: 400; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 28px; }
h2 { font-size: 20px; margin: 0 0 2px; font-weight: 650; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
section { margin-top: 44px; }
#discussiontext p { margin: 0 0 10px; max-width: 760px; } #discussiontext p:last-child { margin-bottom: 0; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; position: sticky; top: 0; z-index: 5; background: var(--page); padding: 10px 0; }
.pick { color: var(--muted); font-size: 12px; margin: 0 0 -4px; }
.insight { font-size: 16px; color: var(--text); margin: 6px 0 14px; max-width: 760px; }
.ctl { color: var(--muted); font-size: 13px; }
.key { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text2); }
.key i { width: 14px; height: 3px; border-radius: 2px; background: var(--text); display: inline-block; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px 8px; text-align: left;
        cursor: pointer; font: inherit; color: inherit; }
.tile:hover { border-color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-wash); }
.tile .lab { font-size: 13px; color: var(--text2); }
.tile .val { font-size: 34px; font-weight: 650; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .val small { font-size: 16px; font-weight: 400; color: var(--text2); margin-left: 3px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 13px; font: inherit; font-size: 13px; color: var(--text2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--text); font-weight: 600; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 10px;
        background: var(--surface); font: inherit; font-size: 13px; color: var(--text); cursor: pointer; }
.chip i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.chip[aria-pressed="false"] { color: var(--muted); }
.chip[aria-pressed="false"] i { background: var(--line) !important; }

.chartwrap { position: relative; }
svg { display: block; width: 100%; height: auto; }
svg text { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--muted); }
svg text.strong { fill: var(--text); font-weight: 650; font-size: 14px; }
svg text.ink { fill: var(--text2); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
       padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 150px; display: none; z-index: 2; }
.tip .d { color: var(--text2); font-size: 12px; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip .r i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tip .r b { font-variant-numeric: tabular-nums; min-width: 44px; }
.tip .r span { color: var(--text2); }

.compare { display: grid; grid-template-columns: 1fr 310px; gap: 16px; align-items: start; }
.panel h3 { font-size: 13px; font-weight: 600; color: var(--text2); margin: 0 0 8px; }
.panel table { width: 100%; border-collapse: collapse; font-size: 14px; }
.panel th { font-size: 11px; font-weight: 500; color: var(--muted); text-align: right; padding: 0 0 6px 10px; white-space: nowrap; }
.panel td { white-space: nowrap; padding-left: 10px !important; }
.panel th:first-child { text-align: left; }
.panel td { padding: 9px 0; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.panel td:first-child { text-align: left; }
.panel td.name i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.panel td.err { font-weight: 650; font-size: 17px; }
.panel td.sm { color: var(--text2); font-size: 13px; }
.panel tr + tr { cursor: pointer; }
.panel tr + tr:hover td, .panel tr + tr:focus td, .panel tr.pin td { background: var(--accent-wash); }
.panel tr:focus { outline: none; }
.panel td:first-child { padding-left: 6px; } .panel td:last-child { padding-right: 6px; }
.panel .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
@media (max-width: 760px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .compare { grid-template-columns: 1fr; }
  h1 { font-size: 26px; }
}
</style>

  const isError = state.view === "Error";
  document.getElementById("hint2").textContent = isError
    ? "Shaded = range of all the models' errors each day (forecast minus observed; zero line = perfect, above = too " + (k === "WIND" ? "strong" : k === "PRCP" ? "wet" : "warm") + "). Today = against what has been observed so far, not final. Dashed = plain average of all five models. Hover a model on the right to light up its line; click to keep it on or turn it off."
    : "Shaded = range of all the models' forecasts each day; the last day is tomorrow. Uncolored line = observed, dashed to today so far (day not finished). Dashed = plain average of all five models. Hover a model on the right to light up its line; click to keep it on or turn it off.";

  const svg = document.getElementById("chart2");
  svg.replaceChildren();
  const W = 700, H = 380, pad = { l: 46, r: 20, t: 18, b: 34 };
  // both views also get today: what has been observed so far, against what the models said for today (not final until the day ends)
  const soFar = DATA.so_far && DATA.so_far[k] !== null && SYSTEMS.some(s => DATA.systems[s][DATA.today]) ? DATA.so_far[k] : null;
  const dates = obsDays.map(o => o.date).concat(soFar !== null ? [DATA.today] : []).concat(isError ? [] : [DATA.target]);
  const value = (s, date) => {
    if (isError && date === DATA.today) { const f = DATA.systems[s][date]; return f && f[k] !== null ? f[k] - soFar : null; }
    if (isError) return errorOf(s, date, k);
    const f = DATA.systems[s][date];
    return f ? f[k] : null;
  };
  // lowest and highest model value on each day = the shaded spread
  const lows = [], highs = [];
  for (const d of dates) {
    const vs = SYSTEMS.map(s => value(s, d)).filter(v => v !== null);
    lows.push(vs.length ? Math.min(...vs) : null);
    highs.push(vs.length ? Math.max(...vs) : null);
  }
  let lo = Infinity, hi = -Infinity;
  for (const v of lows.concat(highs)) if (v !== null) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (isError) { lo = Math.min(lo, k === "PRCP" ? -0.1 : -1); hi = Math.max(hi, k === "PRCP" ? 0.1 : 1); }
  else { for (const o of obsDays) { lo = Math.min(lo, o[k]); hi = Math.max(hi, o[k]); } if (soFar !== null) { lo = Math.min(lo, soFar); hi = Math.max(hi, soFar); } if (k === "PRCP") lo = 0; }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const ticks = niceTicks(lo, hi, k);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - y0) / (y1 - y0));
  const x = i => pad.l + 28 + (W - pad.l - pad.r - 56) * (dates.length > 1 ? i / (dates.length - 1) : 0.5);
  frame(svg, W, H, pad, ticks, k, y);
  dates.forEach((d, i) => {
    const t = svgEl(svg, "text", { x: x(i), y: H - 10, "text-anchor": "middle" }, d === DATA.today ? "Today" : dayLabel(d));
    if (d === DATA.target) t.setAttribute("class", "strong");
  });

  // the spread: always drawn
  const idx = dates.map((d, i) => i).filter(i => lows[i] !== null);
  if (idx.length > 1) {
    const top = idx.map((i, n) => (n ? "L" : "M") + x(i) + " " + y(highs[i])).join("");
    const bottom = idx.slice().reverse().map(i => "L" + x(i) + " " + y(lows[i])).join("");
    svgEl(svg, "path", { d: top + bottom + "Z", fill: "var(--s1)", opacity: 0.18 });
  }
  if (isError) svgEl(svg, "line", { x1: pad.l, x2: W - pad.r, y1: y(0), y2: y(0), stroke: "var(--text2)", "stroke-width": 1.5 });

  function series(parent, points, color, width, dash) {
    let d = "", pen = false;
    points.forEach((v, i) => { if (v === null) { pen = false; return; } d += (pen ? "L" : "M") + x(i) + " " + y(v); pen = true; });
    svgEl(parent, "path", { d: d, fill: "none", stroke: color, "stroke-width": width, "stroke-linejoin": "round", "stroke-dasharray": dash || "none" });
    // today's point is hollow: the day is not finished
    points.forEach((v, i) => {
      if (v === null) return;
      if (dates[i] === DATA.today) svgEl(parent, "circle", { cx: x(i), cy: y(v), r: 4, fill: "var(--surface)", stroke: color, "stroke-width": 2 });
      else svgEl(parent, "circle", { cx: x(i), cy: y(v), r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2 });
    });
  }
  if (!isError) series(svg, dates.map(d => { const o = obsDays.find(q => q.date === d); return o ? o[k] : null; }), "var(--text)", 2);
  if (soFar !== null && !isError) {
    const iToday = dates.indexOf(DATA.today), last = obsDays[obsDays.length - 1];
    if (last) svgEl(svg, "line", { x1: x(iToday - 1), y1: y(last[k]), x2: x(iToday), y2: y(soFar), stroke: "var(--text)", "stroke-width": 2, "stroke-dasharray": "5 5" });
    svgEl(svg, "circle", { cx: x(iToday), cy: y(soFar), r: 4, fill: "var(--surface)", stroke: "var(--text)", "stroke-width": 2 });
  }
  // one hidden line per model; shown while its row on the right is hovered or pinned
  const lineOf = {};
  for (const s of ROWS) {
    lineOf[s] = svgEl(svg, "g", { visibility: state.pinned[s] ? "visible" : "hidden" });
    series(lineOf[s], dates.map(d => value(s, d)), SYSTEM_COLOR[s], 3, s === "Average" ? "7 5" : null);
  }

  // hover on the chart: one tooltip, every model
  const tip = document.getElementById("tip2"), wrap = svg.parentNode;
  const hair = svgEl(svg, "line", { y1: pad.t, y2: H - pad.b, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  svg.onpointermove = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    let i = 0;
    dates.forEach((d, j) => { if (Math.abs(x(j) - px) < Math.abs(x(i) - px)) i = j; });
    const date = dates[i], o = obsDays.find(q => q.date === date);
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
    showTip(tip, wrap, svg, x(i), t => {
      htmlEl(t, "div", "d", date === DATA.today ? "Today  ·  " + fmt(soFar, k) + " " + unit + " so far (through " + DATA.so_far.through + ")"
        : dayLabel(date) + (o ? "  ·  observed " + fmt(o[k], k) + " " + unit : "  ·  forecast day"));
      for (const s of ROWS) {
        const f = DATA.systems[s][date], e = date === DATA.today && f && f[k] !== null ? f[k] - soFar : errorOf(s, date, k);
        if (!f || f[k] === null) { tipRow(t, SYSTEM_COLOR[s], "–", SYSTEM_LABEL[s]); continue; }
        if (o || date === DATA.today) tipRow(t, SYSTEM_COLOR[s], fmt(e, k, true), SYSTEM_LABEL[s] + "  (forecast " + fmt(f[k], k) + ")");
        else tipRow(t, SYSTEM_COLOR[s], fmt(f[k], k), SYSTEM_LABEL[s]);
      }
    });
  };
  svg.onpointerleave = () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); };

  // right-hand panel: trailing mean error per model, closest first; rows light up the lines
  document.getElementById("panelhead").textContent = "Closest first, last " + obsDays.length + " days (" + unit + ")";
  const table = document.getElementById("paneltable");
  table.replaceChildren();
  const head = htmlEl(table, "tr");
  for (const h of ["", "Avg miss", "Bias", "Tomorrow"]) htmlEl(head, "th", "", h);
  const stats = ROWS.map(s => {
    const errs = obsDays.map(o => errorOf(s, o.date, k)).filter(e => e !== null);
    return { s: s, errs: errs, mae: errs.length ? errs.reduce((a, e) => a + Math.abs(e), 0) / errs.length : null };
  }).sort((a, b) => (a.mae === null ? 1e9 : a.mae) - (b.mae === null ? 1e9 : b.mae));
  const nd = k === "PRCP" ? 2 : 1, scored = stats.filter(r => r.mae !== null);
  if (scored.length) {
    const best = scored.filter(r => r.mae.toFixed(nd) === scored[0].mae.toFixed(nd)).map(r => SYSTEM_LABEL[r.s]);
    const ours = scored.find(r => r.s === "Ours"), rank = scored.indexOf(ours) + 1;
    let text = "Over the last " + obsDays.length + " days, " + best.join(" and ") + (best.length > 1 ? " have" : " has") + " been closest on the " +
      VAR_NAME[k].toLowerCase() + ", missing by " + scored[0].mae.toFixed(nd) + " " + unit + " on average.";
    if (ours && !best.includes(SYSTEM_LABEL.Ours)) text += " " + SYSTEM_LABEL.Ours + " misses by " + ours.mae.toFixed(nd) + " " + unit + " (" + rank + " of " + scored.length + ").";
    document.getElementById("insight2").textContent = text;
  }
  for (const row of stats) {
    const s = row.s, errs = row.errs;
    const tr = htmlEl(table, "tr", state.pinned[s] ? "pin" : "");
    tr.tabIndex = 0;
    const name = htmlEl(tr, "td", "name");
    const i = htmlEl(name, "i"); i.style.background = SYSTEM_COLOR[s];
    name.appendChild(document.createTextNode(SYSTEM_LABEL[s]));
    const bias = errs.length ? errs.reduce((a, e) => a + e, 0) / errs.length : null;
    htmlEl(tr, "td", "err", row.mae === null ? "–" : row.mae.toFixed(nd));
    htmlEl(tr, "td", "sm", bias === null ? "–" : (bias > 0 ? "+" : "") + bias.toFixed(nd));
    const f = DATA.systems[s][DATA.target];
    htmlEl(tr, "td", "sm", f ? fmt(f[k], k) : "–");
    const show = () => lineOf[s].setAttribute("visibility", "visible");
    const hide = () => { if (!state.pinned[s]) lineOf[s].setAttribute("visibility", "hidden"); };
    tr.onpointerenter = show; tr.onfocus = show;
    tr.onpointerleave = hide; tr.onblur = hide;
    tr.onclick = () => { state.pinned[s] = !state.pinned[s]; tr.className = state.pinned[s] ? "pin" : ""; lineOf[s].setAttribute("visibility", state.pinned[s] ? "visible" : "hidden"); };
  }
  document.getElementById("panelnote").textContent = "Avg miss = average size of the daily error. Bias = average with sign (+ = too high)." +
    (k === "PRCP" ? " The all-model average uses the four models that give an amount." : "") + (k === "WIND" ? " Raw model wind is 10 m sustained, not the contest 2-min max, so raw models run low." : k === "PRCP" ? " MOS has no precip amount." : "");
}

function drawAll() { drawHeader(); drawConfidence(); drawCompare(); }
// optional start state in the address, e.g. #PRCP,18Z,Forecast
for (const part of decodeURIComponent(location.hash.slice(1)).split(",")) {
  if (VARS.includes(part)) state.variable = part;
  if (part === "Blend" || DATA.inits.includes(part)) state.init = part;
  if (part === "Error" || part === "Forecast") state.view = part;
  if (ROWS.includes(part)) state.pinned[part] = true;
}
drawAll();
</script>
</body>
</html>
