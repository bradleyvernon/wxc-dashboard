* { box-sizing: border-box; }

.meta { color: var(--muted); font-size: 13px; margin: 0 0 28px; }

.hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
section { margin-top: 44px; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; text-align: left;

.tile:hover { border-color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-wash); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 13px; font: inherit; font-size: 13px; color: var(--text2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--text); font-weight: 600; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 10px;
        background: var(--surface); font: inherit; font-size: 13px; color: var(--text); cursor: pointer; }
.chip i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.chip[aria-pressed="false"] { color: var(--muted); }
.chip[aria-pressed="false"] i { background: var(--line) !important; }

.chartwrap { position: relative; }
svg { display: block; width: 100%; height: auto; }
svg text { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--muted); }
svg text.strong { fill: var(--text); font-weight: 650; font-size: 14px; }
svg text.ink { fill: var(--text2); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
       padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 150px; display: none; z-index: 2; }
.tip .d { color: var(--text2); font-size: 12px; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip .r i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tip .r b { font-variant-numeric: tabular-nums; min-width: 44px; }
.tip .r span { color: var(--text2); }

.compare { display: grid; grid-template-columns: 1fr 270px; gap: 16px; align-items: start; }
.panel h3 { font-size: 13px; font-weight: 600; color: var(--text2); margin: 0 0 8px; }
.panel table { width: 100%; border-collapse: collapse; font-size: 14px; }
.panel th { font-size: 11px; font-weight: 500; color: var(--muted); text-align: right; padding: 0 0 6px; }
.panel th:first-child { text-align: left; }
.panel td { padding: 9px 0; border-top: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
.panel td:first-child { text-align: left; }
.panel td.name i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 8px; }
.panel td.err { font-weight: 650; font-size: 17px; }
.panel td.sm { color: var(--text2); font-size: 13px; }
.panel tr.off td { color: var(--muted); }
.panel tr.off td.name i { background: var(--line) !important; }
.panel .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
@media (max-width: 760px) {

  .compare { grid-template-columns: 1fr; }
  h1 { font-size: 26px; }
}

  tiles.replaceChildren();
  for (const k of VARS) {
    const b = htmlEl(tiles, "button", "tile");
    b.setAttribute("aria-pressed", state.variable === k);
    htmlEl(b, "div", "lab", VAR_NAME[k]);
    const v = htmlEl(b, "div", "val", DATA.submitted[k]);
    htmlEl(v, "small", "", VAR_UNIT[k]);
    b.onclick = () => { state.variable = k; drawAll(); };
  }
}

// ---------- section 1: spread inside our model
function drawConfidence() {
  const k = state.variable, unit = VAR_UNIT[k];
  segmented("initseg", [{ label: "Blend", value: "Blend" }].concat(DATA.inits.map(i => ({ label: i, value: i }))), "init", drawAll);
  const view = DATA.ours[k][state.init];
  document.getElementById("hint1").textContent = VAR_NAME[k] + ": observed, then every one of our " + view.members.length +
    " models fanned out to the forecast day (the XGB plus every NN seed).";

  const svg = document.getElementById("chart1");
  svg.replaceChildren();
  const W = 980, H = 380, pad = { l: 46, r: 150, t: 18, b: 34 };
  const obs = DATA.obs.slice(-5).filter(o => o[k] !== null);
  const cols = obs.map(o => ({ date: o.date, value: o[k], kind: "obs" }));
  if (DATA.so_far && DATA.so_far[k] !== null) cols.push({ date: DATA.today, value: DATA.so_far[k], kind: "sofar" });
  cols.push({ date: DATA.target, value: view.forecast, kind: "fc" });

  // y range holds every init's view so the axis does not jump when clicking through inits
  let lo = Infinity, hi = -Infinity;
  for (const c of cols) if (c.kind !== "fc") { lo = Math.min(lo, c.value); hi = Math.max(hi, c.value); }
  for (const name in DATA.ours[k]) {
    const v = DATA.ours[k][name];
    for (const x of v.members.concat([v.forecast])) if (x !== null) { lo = Math.min(lo, x); hi = Math.max(hi, x); }
  }
  if (k === "PRCP") lo = 0;
  const ticks = niceTicks(lo, hi, k);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - y0) / (y1 - y0));
  const x = i => pad.l + 30 + (W - pad.l - pad.r - 30) * i / (cols.length - 1);
  frame(svg, W, H, pad, ticks, k, y);
  cols.forEach((c, i) => {
    const t = svgEl(svg, "text", { x: x(i), y: H - 10, "text-anchor": "middle" }, c.kind === "sofar" ? "Today so far" : dayLabel(c.date));
    if (c.kind === "fc") t.setAttribute("class", "strong");
  });

  const iT = cols.length - 1, iA = iT - 1, xA = x(iA), yA = y(cols[iA].value), xT = x(iT), mid = (xT - xA) * 0.55;
  const curve = v => "C" + (xA + mid) + " " + yA + "," + (xT - mid) + " " + y(v) + "," + xT + " " + y(v);
  // one line per individual model
  for (const m of view.members) svgEl(svg, "path", { d: "M" + xA + " " + yA + curve(m), fill: "none", stroke: "var(--s1)", "stroke-width": 1.2, opacity: 0.45 });
  svgEl(svg, "path", { d: "M" + xA + " " + yA + curve(view.forecast), fill: "none", stroke: "var(--s1)", "stroke-width": 2.5 });

  // observed line (solid through verified days, dashed to today so far)
  const solid = cols.filter(c => c.kind === "obs");
  if (solid.length > 1) svgEl(svg, "path", { d: solid.map((c, i) => (i ? "L" : "M") + x(i) + " " + y(c.value)).join(""), fill: "none", stroke: "var(--text)", "stroke-width": 2, "stroke-linejoin": "round" });
  if (cols[iA].kind === "sofar" && solid.length)
    svgEl(svg, "line", { x1: x(iA - 1), y1: y(cols[iA - 1].value), x2: xA, y2: yA, stroke: "var(--text)", "stroke-width": 2, "stroke-dasharray": "5 5" });
  cols.forEach((c, i) => {
    if (c.kind === "obs") svgEl(svg, "circle", { cx: x(i), cy: y(c.value), r: 4, fill: "var(--text)", stroke: "var(--surface)", "stroke-width": 2 });
    if (c.kind === "sofar") svgEl(svg, "circle", { cx: x(i), cy: y(c.value), r: 4, fill: "var(--surface)", stroke: "var(--text)", "stroke-width": 2 });
  });
  svgEl(svg, "circle", { cx: xT, cy: y(view.forecast), r: 6, fill: "var(--s1)", stroke: "var(--surface)", "stroke-width": 2 });

  // labels right of the fan, kept from overlapping
  const yF = y(view.forecast);
  const ms = view.members.filter(m => m !== null), mHi = Math.max(...ms), mLo = Math.min(...ms);
  const yHi = Math.min(y(mHi) + 4, yF - 15), yLo = Math.max(y(mLo) + 4, yF + 23);
  svgEl(svg, "text", { x: xT + 14, y: yF + 5, class: "strong" }, fmt(view.forecast, k) + " " + unit);
  svgEl(svg, "text", { x: xT + 14, y: yHi, class: "ink" }, fmt(mHi, k) + "  highest");
  svgEl(svg, "text", { x: xT + 14, y: yLo, class: "ink" }, fmt(mLo, k) + "  lowest");

  // hover
  const tip = document.getElementById("tip1"), wrap = svg.parentNode;
  const hair = svgEl(svg, "line", { y1: pad.t, y2: H - pad.b, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  svg.onpointermove = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    let i = 0;
    cols.forEach((c, j) => { if (Math.abs(x(j) - px) < Math.abs(x(i) - px)) i = j; });
    const c = cols[i];
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
    showTip(tip, wrap, svg, x(i), t => {
      if (c.kind === "obs") { htmlEl(t, "div", "d", dayLabel(c.date)); tipRow(t, "var(--text)", fmt(c.value, k) + " " + unit, "observed"); }
      if (c.kind === "sofar") { htmlEl(t, "div", "d", "Today through " + DATA.so_far.through); tipRow(t, "var(--text)", fmt(c.value, k) + " " + unit, "so far"); }
      if (c.kind === "fc") {
        htmlEl(t, "div", "d", dayLabel(c.date) + "  ·  " + state.init);
        tipRow(t, "var(--s1)", fmt(view.forecast, k) + " " + unit, "our forecast");
        if (ms.length) tipRow(t, null, fmt(Math.min(...ms), k) + " – " + fmt(Math.max(...ms), k), ms.length + " models");
      }
    });
  };
  svg.onpointerleave = () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); };
}

// ---------- section 2: model comparison
function errorOf(system, date, k) {
  const f = DATA.systems[system][date], o = DATA.obs.find(d => d.date === date);
  if (!f || !o || f[k] === null || o[k] === null) return null;
  return f[k] - o[k];
}
function drawCompare() {
  const k = state.variable, unit = VAR_UNIT[k];
  segmented("varseg", VARS.map(v => ({ label: VAR_NAME[v], value: v })), "variable", drawAll);
  segmented("viewseg", [{ label: "Error", value: "Error" }, { label: "Forecast", value: "Forecast" }], "view", drawAll);
  const chips = document.getElementById("chips");
  chips.replaceChildren();
  for (const s of SYSTEMS) {
    const b = htmlEl(chips, "button", "chip");
    const i = htmlEl(b, "i"); i.style.background = SYSTEM_COLOR[s];
    b.appendChild(document.createTextNode(s));
    b.setAttribute("aria-pressed", state.on[s]);
    b.onclick = () => { state.on[s] = !state.on[s]; drawAll(); };
  }
  const obsDays = DATA.obs.filter(o => o[k] !== null && SYSTEMS.some(s => errorOf(s, o.date, k) !== null));
  const isError = state.view === "Error";
  document.getElementById("hint2").textContent = isError
    ? VAR_NAME[k] + ": forecast minus observed for each day. Above zero = too " + (k === "WIND" ? "strong" : k === "PRCP" ? "wet" : "warm") + "."
    : VAR_NAME[k] + ": what each system forecast, against what was observed.";

  const svg = document.getElementById("chart2");
  svg.replaceChildren();
  const W = 700, H = 380, pad = { l: 46, r: 20, t: 18, b: 34 };
  const dates = obsDays.map(o => o.date).concat(isError ? [] : [DATA.target]);
  const shown = SYSTEMS.filter(s => state.on[s]);
  const value = (s, date) => {
    if (isError) return errorOf(s, date, k);
    const f = DATA.systems[s][date];
    return f ? f[k] : null;
  };
  let lo = Infinity, hi = -Infinity;
  for (const s of shown) for (const d of dates) { const v = value(s, d); if (v !== null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  if (isError) { lo = Math.min(lo, k === "PRCP" ? -0.1 : -1); hi = Math.max(hi, k === "PRCP" ? 0.1 : 1); }
  else { for (const o of obsDays) { lo = Math.min(lo, o[k]); hi = Math.max(hi, o[k]); } if (k === "PRCP") lo = 0; }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const ticks = niceTicks(lo, hi, k);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - y0) / (y1 - y0));
  const x = i => pad.l + 28 + (W - pad.l - pad.r - 56) * (dates.length > 1 ? i / (dates.length - 1) : 0.5);
  frame(svg, W, H, pad, ticks, k, y);
  if (isError) svgEl(svg, "line", { x1: pad.l, x2: W - pad.r, y1: y(0), y2: y(0), stroke: "var(--text2)", "stroke-width": 1.5 });
  dates.forEach((d, i) => {
    const t = svgEl(svg, "text", { x: x(i), y: H - 10, "text-anchor": "middle" }, dayLabel(d));
    if (d === DATA.target) t.setAttribute("class", "strong");
  });
  function series(points, color, width) {
    let d = "", pen = false;
    points.forEach((v, i) => { if (v === null) { pen = false; return; } d += (pen ? "L" : "M") + x(i) + " " + y(v); pen = true; });
    svgEl(svg, "path", { d: d, fill: "none", stroke: color, "stroke-width": width, "stroke-linejoin": "round" });
    points.forEach((v, i) => { if (v !== null) svgEl(svg, "circle", { cx: x(i), cy: y(v), r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2 }); });
  }
  for (const s of shown.slice().reverse()) series(dates.map(d => value(s, d)), SYSTEM_COLOR[s], s === "Ours" ? 3 : 2);
  if (!isError) series(dates.map(d => { const o = obsDays.find(q => q.date === d); return o ? o[k] : null; }), "var(--text)", 2);

  // hover: one tooltip, every visible system
  const tip = document.getElementById("tip2"), wrap = svg.parentNode;
  const hair = svgEl(svg, "line", { y1: pad.t, y2: H - pad.b, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  svg.onpointermove = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    let i = 0;
    dates.forEach((d, j) => { if (Math.abs(x(j) - px) < Math.abs(x(i) - px)) i = j; });
    const date = dates[i], o = obsDays.find(q => q.date === date);
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
    showTip(tip, wrap, svg, x(i), t => {
      htmlEl(t, "div", "d", dayLabel(date) + (o ? "  ·  observed " + fmt(o[k], k) + " " + unit : "  ·  forecast day"));
      for (const s of shown) {
        const f = DATA.systems[s][date], e = errorOf(s, date, k);
        if (!f || f[k] === null) { tipRow(t, SYSTEM_COLOR[s], "–", s); continue; }
        if (o) tipRow(t, SYSTEM_COLOR[s], fmt(e, k, true), s + "  (forecast " + fmt(f[k], k) + ")");
        else tipRow(t, SYSTEM_COLOR[s], fmt(f[k], k), s);
      }
    });
  };
  svg.onpointerleave = () => { tip.style.display = "none"; hair.setAttribute("visibility", "hidden"); };

  // right-hand panel: trailing mean error per system
  document.getElementById("panelhead").textContent = "Trailing error, last " + obsDays.length + " days (" + unit + ")";
  const table = document.getElementById("paneltable");
  table.replaceChildren();
  const head = htmlEl(table, "tr");
  for (const h of ["", "Mean miss", "Bias", dayLabel(DATA.target).split(" ")[0] + " fcst"]) htmlEl(head, "th", "", h);
  for (const s of SYSTEMS) {
    const errs = obsDays.map(o => errorOf(s, o.date, k)).filter(e => e !== null);
    const tr = htmlEl(table, "tr", state.on[s] ? "" : "off");
    const name = htmlEl(tr, "td", "name");
    const i = htmlEl(name, "i"); i.style.background = SYSTEM_COLOR[s];
    name.appendChild(document.createTextNode(s));
    const mae = errs.length ? errs.reduce((a, e) => a + Math.abs(e), 0) / errs.length : null;
    const bias = errs.length ? errs.reduce((a, e) => a + e, 0) / errs.length : null;
    htmlEl(tr, "td", "err", mae === null ? "–" : mae.toFixed(k === "PRCP" ? 2 : 1));
    htmlEl(tr, "td", "sm", bias === null ? "–" : (bias > 0 ? "+" : "") + bias.toFixed(k === "PRCP" ? 2 : 1));
    const f = DATA.systems[s][DATA.target];
    htmlEl(tr, "td", "sm", f ? fmt(f[k], k) : "–");
  }
  document.getElementById("panelnote").textContent = k === "WIND"
    ? "Mean miss = average size of the error. Raw model wind is 10 m sustained, not the contest 2-min max, so raw models run low."
    : k === "PRCP" ? "Mean miss = average size of the error. MOS has no precip amount." : "Mean miss = average size of the error.";
}

function drawAll() { drawHeader(); drawConfidence(); drawCompare(); }
// optional start state in the address, e.g. #PRCP,18Z,Forecast
for (const part of decodeURIComponent(location.hash.slice(1)).split(",")) {
  if (VARS.includes(part)) state.variable = part;
  if (part === "Blend" || DATA.inits.includes(part)) state.init = part;
  if (part === "Error" || part === "Forecast") state.view = part;
}
drawAll();
</script>
</body>
